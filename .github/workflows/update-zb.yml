name: 每日更新直播源

on:
  schedule:
    # UTC 时间 10:30 (即北京时间 17:30) 运行
    - cron: '30 10 * * *'
  workflow_dispatch: # 允许手动触发

permissions:
  contents: write # 必须要有写入权限，才能 push 到仓库

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 安装依赖
        run: pip install requests

      - name: 运行合并脚本
        run: python merge_sources.py

      - name: 提交并推送变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add zb.txt
          git commit -m "自动更新直播源 $(date)" || echo "无变化，跳过提交"
          git push
