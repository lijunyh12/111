name: Update IPTV Source

on:
  schedule:
    # 北京时间 17:00 = UTC 时间 09:00
    - cron: '0 9 * * *'
  workflow_dispatch: # 允许手动触发，方便调试

permissions:
  contents: write # 允许 Action 写回仓库

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run script
        run: python "import requests.py" # 注意：你的文件名包含空格，请确保仓库中文件名与此完全一致，或重命名为更简单的名称（如 update.py）

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto update zb.txt [skip ci]"
          file_pattern: zb.txt
