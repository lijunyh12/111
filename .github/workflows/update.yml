name: Daily IPTV Update

on:
  schedule:
    # 每天 UTC 09:00 (北京时间 17:00) 运行
    - cron: '0 9 * * *'
  workflow_dispatch: # 允许在网页上手动点击触发

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 允许 Action 提交 zb.txt

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖及 Playwright
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          playwright install --with-deps chromium

      - name: 运行更新脚本
        run: python update.py

      - name: 提交并推送修改后的 zb.txt
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add zb.txt
          # 如果文件有变化则提交，没变化则忽略
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto Update IPTV Source: $(date +'%Y-%m-%d %H:%M:%S')" && git push)
