name: Sync to Gitee

on:
  schedule:
    - cron: '0 2 * * *'   # 每天 UTC 2:00（北京时间 10:00）自动运行
  workflow_dispatch:       # 支持在 Actions 页面手动点击运行

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror to Gitee
        uses: Yikun/hub-mirror-action@master
        with:
          src: github/lijunyh12
          dst: gitee/lijun1212
          dst_key: ${{ secrets.GITEE_PRIVATE_KEY }}
          dst_token: ${{ secrets.GITEE_TOKEN }}
          static_list: '111'
          force_update: true
          debug: true
